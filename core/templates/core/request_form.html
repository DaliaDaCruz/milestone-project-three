{% extends 'core/base.html' %}

{% block content %}
<main class="py-12 md:py-20 flex-1 bg-warmbg">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Header & Navigation -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <span class="text-xs font-extrabold uppercase text-crema-500 tracking-widest bg-crema-500/10 px-3.5 py-1.5 rounded-full">
                    Diagnostic Booking
                </span>
                <h1 class="font-heading font-extrabold text-2xl sm:text-3xl text-espresso-900 mt-3">
                    {{ title|default:"Request Service & Diagnostic" }}
                </h1>
            </div>
            <a href="{% url 'request_list' %}" class="text-xs sm:text-sm font-bold text-stone-600 hover:text-crema-500 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left text-xs"></i> Return to Workshop
            </a>
        </div>

        <!-- Request Form Card -->
        <div class="bg-white p-6 sm:p-10 rounded-3xl border border-stone-200/80 shadow-md">
            <form action="{% url 'request_create' %}" method="POST">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Your Name</label>
        <input type="text" name="name" required placeholder="e.g. Jane Doe" class="w-full px-4 py-3 rounded-xl bg-white border border-stone-200 text-espresso-900">
    </div>
    <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Machine Brand & Model</label>
        <input type="text" name="machine_model" required placeholder="e.g. Sage Barista Express" class="w-full px-4 py-3 rounded-xl bg-white border border-stone-200 text-espresso-900">
    </div>
    <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Issue Description</label>
        <textarea name="description" rows="3" required placeholder="e.g. No pressure building up..." class="w-full px-4 py-3 rounded-xl bg-white border border-stone-200 text-espresso-900"></textarea>
    </div>
    <button type="submit" class="w-full py-4 bg-espresso-800 text-white font-bold rounded-xl">
        Request Diagnostic Quote
    </button>
</form>
        </div>

    </div>
</main>
{% endblock %}
