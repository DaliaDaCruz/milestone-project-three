{% extends 'core/base.html' %}

{% block title %}Page Not Found | Coffee CPR{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h2 class="fw-bold mb-3">Oops! Page Not Found</h2>

        <a href="{% url 'index' %}" class="btn btn-dark btn-lg">Return to Homepage</a>
    </div>
</div>
{% endblock %}
