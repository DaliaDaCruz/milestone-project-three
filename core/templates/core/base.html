{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee CPR - Giving your machine a second shot!{% endblock %}</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inline Coffee Cup Favicon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E☕%3C/text%3E%3C/svg%3E">

    <!-- Tailwind CSS CDN & Custom Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espresso: {
                            900: '#1c100b',
                            800: '#2C1810',
                            700: '#42281d',
                            600: '#5c3829',
                        },
                        crema: {
                            500: '#C88A36',
                            600: '#b07527',
                            100: '#FDF6EB',
                        },
                        roast: {
                            500: '#E07A5F',
                        },
                        warmbg: '#faf8f5',
                        warmcard: '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    },
                    boxShadow: {
                        'coffee-glow': '0 20px 40px -15px rgba(44, 24, 16, 0.15)',
                        'circle-glow': '0 25px 50px -12px rgba(200, 138, 54, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c88a36;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-warmbg text-espresso-900 font-sans antialiased selection:bg-crema-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-espresso-900 border-b border-stone-800 text-white sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="{% url 'request_list' %}" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-crema-500 text-white flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-mug-hot"></i>
                </div>
                <span class="font-heading font-extrabold text-xl tracking-wide text-white group-hover:text-crema-500 transition-colors">COFFEE CPR</span>
            </a>
            
            <div class="flex items-center gap-4">
                <a href="{% url 'checkout' %}" class="py-2 px-4 bg-crema-500 hover:bg-crema-600 text-white font-bold rounded-xl text-xs transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Checkout
                </a>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Block -->
    <div class="flex-1">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-espresso-900 text-white py-8 border-t border-espresso-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-crema-500 text-white flex items-center justify-center font-bold text-sm">
                    <i class="fa-solid fa-mug-hot"></i>
                </div>
                <div>
                    <span class="font-heading font-extrabold text-base tracking-tight">COFFEE CPR</span>
                    <p class="text-[10px] text-stone-400">Giving your machine a second shot!</p>
                </div>
            </div>
            <p class="text-xs text-stone-400">&copy; 2026 Coffee CPR Workshop. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
