{% extends 'core/base.html' %}

{% block title %}{{ machine.name }} | Coffee CPR{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row">
    <div class="col-md-6">
      <img src="{{ machine.get_image_url }}" class="img-fluid rounded shadow-sm" alt="{{ machine.name }}">
    </div>
    <div class="col-md-6">
      <h2 class="fw-bold">{{ machine.name }}</h2>
      <h4 class="text-dark fw-bold mb-3">£ {{ machine.price }}</h4>
      <p class="lead text-muted">{{ machine.description }}</p>
      
      <hr>
      
      <h5 class="fw-bold">Specifications</h5>
      <p>{{ machine.specs }}</p>
<form action="{% url 'add_to_cart' machine.pk %}" method="POST" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary btn-lg">Add to Basket</button>
</form>

      <a href="{% url 'catalog' %}" class="btn btn-outline-dark mt-3">Back to Catalog</a>
    </div>
  </div>
</div>
{% endblock %}
