{% extends 'core/base.html' %}

{% block title %}Login | Coffee CPR{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-4">Welcome Back ☕</h2>

                    <!-- DISPLAY FORM LEVEL ERRORS (e.g. Invalid Credentials) -->
                    {% if form.errors %}
                        <div class="alert alert-danger small py-2">
                            Invalid username or password. Please try again.
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 mt-3 fw-semibold">Log In</button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">Need an account? <a href="{% url 'register' %}" class="fw-semibold">Sign up here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
